<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — LagosPay</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="topbar">
  <span class="brand">🟢 LagosPay</span>
  <nav><span id="who"></span><button id="logout">Log out</button></nav>
</div>
<div class="wrap">
  <h2>Dashboard</h2>
  <div class="msg err" id="top-err"></div>
  <div class="card">
    <h3>Create payment link</h3>
    <div class="msg err" id="c-err"></div>
    <div class="msg ok" id="c-ok"></div>
    <form id="create">
      <label>What is it for?<input name="title" required placeholder="e.g. Ankara fabric — 6 yards"></label>
      <label>Details (optional)<textarea name="description" rows="2" placeholder="Pickup at Balogun shop, etc."></textarea></label>
      <label>Amount (₦)<input name="amountNaira" required inputmode="decimal" placeholder="25000"></label>
      <button class="btn" type="submit">Create link</button>
    </form>
    <div class="share" id="share" style="display:none"></div>
  </div>

  <div class="card">
    <h3>Your links</h3>
    <div id="links"><span style="color:var(--muted)">Loading…</span></div>
  </div>

  <div class="card">
    <h3>Payments</h3>
    <div class="msg err" id="r-err" style="display:none"></div>
    <div class="msg ok" id="r-ok" style="display:none"></div>
    <div id="payments"><span style="color:var(--muted)">Loading…</span></div>
  </div>
</div>
<script>
const err = (m) => document.getElementById('top-err').textContent = m || '';
async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401) { location.href = '/'; return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 429 || j.error === 'too_many_requests') {
      const s = j.retry_after_secs != null ? j.retry_after_secs : '?';
      throw new Error(`Too many attempts. Please wait ${s} seconds before trying again.`);
    }
    throw new Error(j.message || j.error || 'request_failed');
  }
  return j;
}
async function load() {
  err('');
  try {
    const me = await api('/api/me');
    document.getElementById('who').textContent = me.businessName + ' · ';
    if (!me.paystackConfigured) {
      document.getElementById('top-err').textContent = 'Paystack keys are not set on the server — customers cannot pay yet. Add PAYSTACK_SECRET_KEY / PAYSTACK_PUBLIC_KEY to .env.';
    }
    const links = await api('/api/links');
    document.getElementById('links').innerHTML = links.length ? links.map(l =>
      `<div class="linkline"><span><b>${escapeHtml(l.title)}</b> — ₦${l.amountNaira}<br><a href="${l.url}" target="_blank">${l.url}</a></span><span style="color:var(--muted)">${new Date(l.created_at + 'Z').toLocaleString()}</span></div>`
    ).join('') : '<span style="color:var(--muted)">No links yet — create your first one above.</span>';
    const pays = await api('/api/payments');
    const rowFor = (p) => {
      const mismatch = p.amount_mismatch || (p.status === 'paid' && p.expected_kobo != null && p.amount_kobo !== p.expected_kobo);
      const statusLabel = mismatch ? (p.amount_kobo < p.expected_kobo ? 'paid — underpaid' : 'paid — overpaid') : p.status;
      const statusClass = mismatch ? 'mismatch' : p.status;
      const amounts = mismatch ? `₦${p.amountNaira} <span style="color:var(--muted)">(asked ₦${p.expectedNaira})</span>` : `₦${p.amountNaira}`;
      const wait = p.status === 'pending' && p.waiting_label ? `<br><span style="font-size:12px;color:#854d0e">${escapeHtml(p.waiting_label)}</span>` : '';
      const next = p.next_step ? `<br><span style="font-size:12px;color:var(--muted)">${escapeHtml(p.next_step)}</span>` : '';
      const refund = p.status === 'paid' ? `<button class="btn btn-ghost" data-refund="${p.id}">Refund</button>` : '';
      return `<tr><td>${escapeHtml(p.link_title)}</td><td>${escapeHtml(p.customer_email || '—')}</td><td>${amounts}</td><td style="font-family:monospace;font-size:12px">${escapeHtml(p.reference)}</td><td><span class="pill ${statusClass}">${escapeHtml(statusLabel)}</span>${wait}${next}</td><td>${refund}</td></tr>`;
    };
    document.getElementById('payments').innerHTML = pays.length ? `<table><tr><th>For</th><th>Customer</th><th>Paid (asked)</th><th>Reference</th><th>Status · wait · next step</th><th></th></tr>${pays.map(rowFor).join('')}</table><p style="color:var(--muted);font-size:13px">Match rows using the Paystack reference + customer email. A repeat Pay tap reuses the same pending payment, so one sale shows one pending row. Under/over-payments are flagged "paid — underpaid/overpaid" with paid vs asked amounts: collect the balance or refund the difference. Pending rows show how long they have waited — allow ~5 min for bank transfer/USSD before chasing. Closing the popup starts a fresh payment.</p>` : '<span style="color:var(--muted)">No payments yet — share a link to get paid.</span>';
    document.querySelectorAll('[data-refund]').forEach(b => b.onclick = () => refund(b.dataset.refund, b));
  } catch (e) { err(e.message); }
}
async function refund(id, btn) {
  if (!confirm('Refund this customer in full via Paystack?')) return;
  btn.disabled = true;
  const errBox = document.getElementById('r-err');
  const okBox = document.getElementById('r-ok');
  errBox.style.display = 'none'; errBox.textContent = '';
  okBox.style.display = 'none'; okBox.textContent = '';
  try {
    const r = await api(`/api/payments/${id}/refund`, { method: 'POST' });
    okBox.style.display = 'block';
    okBox.textContent = r.message || ('Refund ' + r.status);
    load();
  } catch (e) {
    // Refund did not reach Paystack: payment is still paid, retry is safe.
    errBox.style.display = 'block';
    errBox.textContent = (e.message || 'Refund failed.') + ' The payment is still paid and no money moved — press Refund again to retry.';
    btn.disabled = false;
  }
}
document.getElementById('create').onsubmit = async (e) => {
  e.preventDefault();
  document.getElementById('c-err').textContent = '';
  document.getElementById('c-ok').textContent = '';
  const f = Object.fromEntries(new FormData(e.target));
  try {
    const l = await api('/api/links', { method: 'POST', body: JSON.stringify(f) });
    document.getElementById('c-ok').textContent = `Link created: ${l.title} — ₦${l.amountNaira}`;
    const s = document.getElementById('share');
    s.style.display = 'block';
    s.innerHTML = `Send this to your customer: <a href="${l.url}" target="_blank">${l.url}</a>`;
    e.target.reset(); load();
  } catch (ex) {
    const map = {
      amount_must_be_positive: 'Amount must be more than ₦0. Enter an amount above zero.',
      amount_too_large: 'Amount is above the ₦10,000,000 limit. Enter ₦10,000,000 or less, or split it into smaller links.',
      amount_invalid: 'Amount must be more than ₦0 and not more than ₦10,000,000.',
    };
    document.getElementById('c-err').textContent = map[ex.message] || ex.message;
  }
};
document.getElementById('logout').onclick = async () => { await api('/api/auth/logout', { method: 'POST' }); location.href = '/'; };
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
load();
</script>
</body>
</html>
