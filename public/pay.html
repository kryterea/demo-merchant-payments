<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay — LagosPay</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
<div class="topbar"><span class="brand">🟢 LagosPay</span><nav></nav></div>
<div class="wrap">
  <div class="card paybox">
    <div id="loading">Loading payment details…</div>
    <div id="payform" style="display:none">
      <div style="color:var(--muted)" id="biz"></div>
      <h2 id="title" style="margin:4px 0"></h2>
      <div style="color:var(--muted)" id="desc"></div>
      <div class="amount">₦<span id="amt"></span></div>
      <div class="msg err" id="p-err"></div>
      <div class="msg ok" id="p-ok"></div>
      <form id="pay">
        <label>Your email<input name="email" type="email" required placeholder="customer@example.com"></label>
        <button class="btn" type="submit" id="paybtn">Pay with Paystack</button>
      </form>
      <p style="color:var(--muted);font-size:13px;margin-top:10px">Tapping Pay twice reuses the same pending payment — you will only be charged once. If confirmation takes a moment, wait about a minute then tap Pay again.</p>
      <div class="msg ok" id="p-retry" style="display:none"></div>
    </div>
    <div id="done" style="display:none">
      <h2>✅ Payment successful</h2>
      <p>Thank you! The business has been notified.</p>
    </div>
  </div>
</div>
<script>
const code = location.pathname.split('/').pop();
async function init() {
  try {
    const r = await fetch('/api/pay/' + code);
    if (!r.ok) throw new Error('This payment link does not exist.');
    const l = await r.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('payform').style.display = 'block';
    document.getElementById('biz').textContent = l.businessName;
    document.getElementById('title').textContent = l.title;
    document.getElementById('desc').textContent = l.description || '';
    document.getElementById('amt').textContent = l.amountNaira;
  } catch (e) {
    document.getElementById('loading').textContent = e.message;
  }
}
document.getElementById('pay').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('paybtn');
  const errBox = document.getElementById('p-err');
  const okBox = document.getElementById('p-ok');
  const retryBox = document.getElementById('p-retry');
  errBox.textContent = '';
  okBox.textContent = '';
  retryBox.style.display = 'none';
  retryBox.textContent = '';
  btn.disabled = true; // stay disabled while initiate is in flight so a double tap cannot create a duplicate
  try {
    const email = new FormData(e.target).get('email');
    const r = await fetch('/api/pay/' + code + '/initiate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'paystack_not_configured' ? 'Payments are not enabled yet — please contact the business.' : (j.error || 'Could not start payment.'));
    if (j.reused) {
      okBox.textContent = 'Continuing your pending payment — you will only be charged once.';
    }
    const handler = PaystackPop.setup({
      key: j.publicKey, email: j.email, amount: j.amountKobo, ref: j.reference, currency: 'NGN',
      callback: async function () {
        const v = await fetch('/api/pay/' + code + '/verify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference: j.reference })
        });
        const vj = await v.json().catch(() => ({}));
        if (v.ok && vj.status === 'paid' && !vj.amount_mismatch) {
          document.getElementById('payform').style.display = 'none';
          document.getElementById('done').style.display = 'block';
        } else if (v.ok && vj.status === 'paid' && vj.amount_mismatch) {
          // Money left the customer's account, so never say "not charged".
          // Show paid vs asked-for so both sides know to refund/collect.
          document.getElementById('payform').style.display = 'none';
          const done = document.getElementById('done');
          done.style.display = 'block';
          done.querySelector('h2').textContent = vj.underpaid ? '⚠️ Payment received — less than asked' : '⚠️ Payment received — more than asked';
          done.querySelector('p').textContent = (vj.paid_naira && vj.expected_naira)
            ? `You paid ₦${vj.paid_naira} but this link asked for ₦${vj.expected_naira}. It is flagged to the merchant (paid ₦${vj.paid_naira} / asked ₦${vj.expected_naira}) who will contact you to ${vj.underpaid ? 'collect the balance' : 'refund the difference'}. Please do not pay again.`
            : (vj.message || 'Your payment was received and is shown to the merchant, who will contact you about a refund or balance. Please do not pay again.');
        } else if (v.ok && vj.status === 'pending') {
          // Still processing (bank transfer / USSD): keep waiting, not failed.
          errBox.textContent = '';
          okBox.textContent = vj.message || 'Your payment is still processing. Please wait a few minutes, then refresh or tap Pay again — do not start a new payment.';
          btn.disabled = false;
        } else if (vj.status === 'failed' || (vj.retryable && vj.fresh)) {
          // Failed: nothing was charged, so start a fresh payment next tap
          // (initiate only reuses pending rows, so this creates a new one).
          retryBox.style.display = 'block';
          retryBox.textContent = vj.message || 'This payment failed and you were not charged. Tap Pay again to start a fresh payment.';
          btn.disabled = false;
        } else if (vj.error === 'reference_mismatch') {
          errBox.textContent = vj.message || 'This payment reference belongs to a different payment link. Please use the correct link.';
          btn.disabled = false;
        } else {
          errBox.textContent = vj.message || 'We could not confirm your payment. If you were charged, the business will follow up.';
          btn.disabled = false;
        }
      },
      onClose: function () {
        // Popup closed without paying: mark the pending row abandoned so the
        // next tap starts a fresh payment instead of reusing a stale row.
        fetch('/api/pay/' + code + '/abandon', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference: j.reference })
        }).catch(() => {});
        okBox.textContent = 'Payment window closed — tap Pay again to start a fresh payment.';
        btn.disabled = false;
      }
    });
    handler.openIframe();
  } catch (err) { errBox.textContent = err.message; btn.disabled = false; }
};
init();
</script>
</body>
</html>
